[global]
follow = mouse
width = (340, 440)
height = (96, 280)
origin = top-right
offset = (18, 18)
notification_limit = 5
progress_bar = true
progress_bar_height = 4
progress_bar_corner_radius = 2
progress_bar_frame_width = 0
progress_bar_min_width = 120
progress_bar_max_width = 280
indicate_hidden = true
transparency = 0
separator_height = 0
padding = 14
horizontal_padding = 16
text_icon_padding = 12
frame_width = 1
frame_color = "{{colors.outline.default.hex}}"
gap_size = 8
sort = true
idle_threshold = 120
font = JetBrainsMono Nerd Font 11
line_height = 2
markup = full
format = "<span size='small' foreground='{{colors.outline.default.hex}}'>%a</span>\n<span size='large' weight='bold'>%s</span>\n%b"
alignment = left
vertical_alignment = center
show_age_threshold = 60
ignore_newline = false
stack_duplicates = true
hide_duplicate_count = false
sticky_history = yes
history_length = 20
corner_radius = 14
corners = all
mouse_left_click = close_current
mouse_middle_click = do_action, close_current
mouse_right_click = close_all
min_icon_size = 36
max_icon_size = 48
highlight = "{{colors.primary.default.hex}}"

[urgency_low]
background = "{{colors.surface_container.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
frame_color = "{{colors.outline_variant.default.hex}}"
timeout = 4

[urgency_normal]
background = "{{colors.surface_container.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
frame_color = "{{colors.outline.default.hex}}"
timeout = 6

[urgency_critical]
background = "{{colors.error_container.default.hex}}"
foreground = "{{colors.on_error_container.default.hex}}"
frame_color = "{{colors.error.default.hex}}"
timeout = 0

[dotfiles]
appname = "Dotfiles"
set_stack_tag = dotfiles
frame_color = "{{colors.primary.default.hex}}"
timeout = 8

[volume_notifications]
appname = volume
summary = *
history_ignore = true
set_stack_tag = volume
min_icon_size = 36
max_icon_size = 48

